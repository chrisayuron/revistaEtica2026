<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#542579"><title>Revista Digital · Ética y Valores</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#28113b;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.shell{width:min(100%,1100px);position:relative;line-height:0;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0007}
img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;border-radius:22px;outline:0;transition:background .15s,box-shadow .15s;cursor:pointer;line-height:normal;text-decoration:none}
.hotspot:hover,.hotspot:focus-visible{background:#fff2;box-shadow:inset 0 0 0 4px #fff,0 0 22px #fff8}
/* Hotspots map the six grade buttons in the original artwork */
.g6{left:38.4%;top:55.6%;width:19.1%;height:12.5%}.g7{left:58.0%;top:55.6%;width:19.0%;height:12.5%}.g8{left:77.7%;top:55.6%;width:19.0%;height:12.5%}
.g9{left:38.4%;top:69.5%;width:19.1%;height:12.5%}.g10{left:58.0%;top:69.5%;width:19.0%;height:12.5%}.g11{left:77.7%;top:69.5%;width:19.0%;height:12.5%}
.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#fff9;font-size:12px;line-height:1.3;text-align:center}
@media(max-width:600px){body{padding:6px}.shell{border-radius:8px}.hotspot{border-radius:10px}.hint{position:static;transform:none;padding:8px}}
</style></head><body>
<div class="shell" aria-label="Revista digital interactiva">
<img src="portada.png" alt="Invitación a explorar las revistas digitales de Ética y Valores de los grados sexto a undécimo">
<a class="hotspot g6" href="https://etica20262.my.canva.site/etica6" target="_blank" rel="noopener" aria-label="Abrir revista de grado 6"></a>
<a class="hotspot g7" href="https://etica20262.my.canva.site/etica7" target="_blank" rel="noopener" aria-label="Abrir revista de grado 7"></a>
<a class="hotspot g8" href="https://etica20262.my.canva.site/etica8" target="_blank" rel="noopener" aria-label="Abrir revista de grado 8"></a>
<a class="hotspot g9" href="https://etica20262.my.canva.site/etica9" target="_blank" rel="noopener" aria-label="Abrir revista de grado 9"></a>
<a class="hotspot g10" href="https://etica20262.my.canva.site/etica10" target="_blank" rel="noopener" aria-label="Abrir revista de grado 10"></a>
<a class="hotspot g11" href="https://etica20262.my.canva.site/etica11" target="_blank" rel="noopener" aria-label="Abrir revista de grado 11"></a>
</div><div class="hint">Pulsa sobre el botón de tu grado en la imagen para abrir la revista.</div>
